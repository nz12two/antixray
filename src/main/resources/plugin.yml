name: AntiXray
version: 2.0.0
main: com.antixray.plugin.AntiXrayPlugin
authors: [AntiXray Team]
api-version: 1.21
folia-supported: true
softdepend: [ProtocolLib]
description: Advanced modular anti-xray detection with 19 detectors, obfuscation engine, ML training, temporal risk engine, and statistical learning

commands:
  antixray:
    description: Main AntiXray command
    aliases: [ax, mt]
    usage: /antixray <command>
    permission: antixray.use

permissions:
  antixray.use:
    description: Access to basic commands
    default: op
  antixray.admin:
    description: Administrative commands (reset, reload, profiler)
    default: op
  antixray.notify:
    description: Receive detection notifications
    default: op
  antixray.bypass:
    description: Bypass detection
    default: false
  antixray.ml:
    description: Access to ML training commands
    default: op
  antixray.dataset:
    description: Access to dataset recording commands
    default: op
  antixray.obfuscation.bypass:
    description: Bypass block obfuscation
    default: false
